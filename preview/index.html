function empty(title,description){return `<div class="empty-state">${icon('grid')}<h3>${esc(title)}</h3><p>${esc(description)}</p></div>`;}
function pageHead(label,title,description,breadcrumb=''){return `<div class="page-head wrap">${breadcrumb}<span class="eyebrow">${label}</span><h1>${esc(title)}</h1>${description?`<p>${esc(description)}</p>`:''}</div>`;}
function casesPage(){const params=new URLSearchParams(previewLocation.search),category=params.get('category'),client=params.get('client'),type=params.get('type')||'',q=params.get('q')||'',all=params.get('view')==='all';const selected=config.categories.find(x=>x.id===category),customer=config.clients.find(x=>x.id===client);const overview=!category&&!client&&!type&&!q&&!all;
  let filtered=cases.filter(c=>(!category||c.categoryId===category)&&(!client||c.clientId===client)&&(!type||c.type===type)&&(!q||(c.title+' '+c.summary).toLowerCase().includes(q.toLowerCase())));
  return `<main id="main">${pageHead('BUSINESS & CASES',customer?`${customer.name}案例`:selected?selected.name:'业务与案例',customer?'通过不同形式的内容，呈现品牌合作与服务成果。':selected?selected.description:'从服务能力到项目成果，了解银通联如何为品牌创造价值。',`<div class="breadcrumb"><a href="/">首页</a><span>/</span>${(selected||customer)?'<a href="/cases">业务与案例</a><span>/</span>':''}<span>${esc(customer?.name||selected?.name||'业务与案例')}</span></div>`)}<div class="wrap">${overview?`<div class="category-overview">${config.categories.map((c,i)=>{const pic=cases.find(x=>x.categoryId===c.id);return `<article class="category-feature"><div class="category-feature-copy"><span class="eyebrow">0${i+1} / ${esc(c.subtitle)}</span><h2>${esc(c.name)}</h2><p>${esc(c.description)}</p><div class="service-list">${c.services.map(s=>`<span>${esc(s)}</span>`).join('')}</div><a class="text-link gold" href="/cases?category=${enc(c.id)}">查看${i===0?'营销':i===1?'内容':'技术'}案例 ${icon('arrow')}</a></div>${pic?`<a class="category-feature-image" href="/cases?category=${enc(c.id)}" aria-label="查看${esc(c.name)}案例"><img src="${esc(pic.cover)}" alt="${esc(pic.title)}" loading="lazy"></a>`:''}</article>`;}).join('')}</div><section class="section"><div class="section-heading"><div><span class="eyebrow">BY CLIENT</span><h2>按客户看案例</h2></div><a class="text-link" href="/cases?view=all">查看全部 ${icon('arrow')}</a></div><div class="client-names">${config.clients.map(c=>`<a href="/cases?client=${enc(c.id)}">${esc(c.name)} ${icon('arrow')}</a>`).join('')}</div></section>`:''}<section class="${overview?'section':''}" style="padding-bottom:70px">${overview?'<div class="section-heading"><div><span class="eyebrow">ALL PROJECTS</span><h2>全部案例</h2></div></div>':''}<div class="browse-toolbar"><div class="tabs" role="group" aria-label="作品类型筛选">${[['','全部'],['video','视频'],['graphic','图文设计'],['h5','H5互动'],['mixed','整合案例']].map(([v,n])=>`<button class="tab ${v===type?'active':''}" data-filter-type="${v}" aria-pressed="${v===type}">${n}</button>`).join('')}</div><div class="filters"><select id="category-filter" aria-label="业务分类"><option value="">全部业务</option>${config.categories.map(c=>`<option value="${c.id}" ${c.id===category?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="client-filter" aria-label="客户筛选"><option value="">全部客户</option>${config.clients.map(c=>`<option value="${c.id}" ${c.id===client?'selected':''}>${esc(c.name)}</option>`).join('')}</select><form id="search-form"><input class="search-input" name="q" type="search" placeholder="搜索案例名称" value="${esc(q)}" aria-label="搜索案例"></form></div></div><div class="results-summary">${filtered.length} 个案例${q?' · 搜索：'+esc(q):''}</div>${filtered.length?`<div class="work-grid">${filtered.map(card).join('')}</div>`:empty('暂无符合条件的案例','试试其他业务、客户或作品类型。')}</section></div></main>`;
}
function caseDetail(id){const c=cases.find(x=>x.id===id);if(!c)return `<main id="main" class="wrap section">${empty('案例暂不可查看','该案例可能尚未发布或已经下架。')}<p style="margin-top:20px"><a class="button" href="/cases">返回业务与案例 ${icon('arrow')}</a></p></main>`;
  const related=cases.filter(x=>x.id!==id&&(x.clientId===c.clientId||x.categoryId===c.categoryId)).slice(0,2);return `<main id="main" class="wrap"><div class="page-head"><div class="breadcrumb"><a href="/">首页</a><span>/</span><a href="/cases">业务与案例</a><span>/</span><a href="/cases?category=${enc(c.categoryId)}">${esc(categoryName(c.categoryId))}</a></div></div><section class="case-head"><div>${c.video?`<video controls playsinline preload="metadata" poster="${esc(c.cover)}" src="${esc(c.video)}" aria-label="${esc(c.title)}视频"></video>`:`<button data-gallery-case="${esc(c.id)}" data-gallery-index="-1" style="border:0;padding:0;display:block;background:transparent;width:100%" aria-label="放大查看${esc(c.title)}封面"><img src="${esc(c.cover)}" alt="${esc(c.title)}封面"></button>`}${c.type==='video'&&!c.video?'<div class="media-notice">当前展示公司介绍中的案例画面，原视频上传后可在线播放。</div>':''}${c.type==='h5'&&!c.experienceUrl?'<div class="media-notice">当前展示项目截图，体验链接待补充。</div>':''}</div><div class="case-summary"><span class="eyebrow">PROJECT / ${esc(typeName[c.type])}</span><h1>${esc(c.title)}</h1><p>${esc(c.summary)}</p><dl class="case-meta"><div class="meta-row"><dt>项目客户</dt><dd><a href="/cases?client=${enc(c.clientId)}">${esc(clientName(c.clientId))} →</a></dd></div><div class="meta-row"><dt>所属业务</dt><dd><a href="/cases?category=${enc(c.categoryId)}">${esc(categoryName(c.categoryId))} →</a></dd></div><div class="meta-row"><dt>服务内容</dt><dd>${c.services.map(s=>`<span class="pill">${esc(s)}</span>`).join(' ')}</dd></div></dl><div class="case-tools"><button class="button" data-contact>咨询同类项目 ${icon('arrow')}</button><button class="button secondary" data-share>${icon('share')} 分享案例</button></div>${c.experienceUrl?`<div class="case-tools"><a class="button secondary" href="${esc(c.experienceUrl)}" target="_blank" rel="noopener noreferrer">体验H5项目 ${icon('arrow')}</a></div>`:''}</div></section><section class="detail-section"><span class="eyebrow">PROJECT BRIEF</span><h2>项目介绍</h2><p class="case-description function platformsPage(){return `<main id="main">${pageHead('PLATFORM ENTRANCE','平台入口','连接现有GEO与漫剧平台，使用相应的业务服务。')}<div class="wrap"><div class="platform-page">${config.platforms.map(p=>`<article class="platform-card">${icon(p.id==='geo'?'search':'film')}<span class="eyebrow">${p.id==='geo'?'GENERATIVE ENGINE OPTIMIZATION':'COMIC PRODUCTION'}</span><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="platform-actions">${p.url?`<button class="button" data-platform="${p.id}">进入${p.id==='geo'?'GEO':'漫剧'}平台 ${icon('arrow')}</button><button class="button secondary small" data-copy-url="${esc(p.url)}">复制链接</button>`:'<button class="button" data-contact>咨询平台使用方式 '+icon('arrow')+'</button>'}</div><div class="platform-notice">${p.url?'进入后需使用原平台账号登录。':'平台入口待配置，可先联系公司了解使用方式。'}${p.url&&!p.mobileUrl?' 建议在电脑端使用。':''}</div></article>`).join('')}</div><div class="info-panel"><p><strong>关于手机端使用</strong>现有平台以电脑端为主。手机页面适配及账号开通方式确认后，再补充相应入口。</p><button class="text-link" style="border:0;background:transparent" data-contact>联系协助 ${icon('arrow')}</button></div></div></main>`;}
function teamSection(){const members=config.company.teamMembers||[];return members.length?`<section class="team-section wrap"><div class="section-heading"><div><span class="eyebrow">OUR PEOPLE</span><h2>把创意变成作品的人。</h2></div><p class="muted">策略、创意、内容与技术，共同协作。</p></div>${[['management','管理团队'],['execution','执行团队']].map(([group,label])=>{const list=members.filter(m=>m.group===group);return list.length?`<div class="team-group"><h3 class="team-group-title">${label}<span>${String(list.length).padStart(2,'0')}</span></h3><div class="people-grid ${group}">${list.map(m=>`<article class="person-card"><div class="person-photo">${m.photo?`<img src="${esc(m.photo)}" alt="${esc(m.name)}" loading="lazy">`:`<span>${esc(m.name.slice(0,1))}</span>`}</div><div class="person-info"><p class="person-role">${esc(m.role)}</p><h3>${esc(m.name)}</h3><p class="person-bio">${esc(m.biography)}</p></div></article>`).join('')}</div></div>`:'';}).join('')}</section>`:'';}

function render(){const path=decodeURIComponent(previewLocation.pathname);let main=path==='/'?home():path==='/cases'?casesPage():path.startsWith('/cases/')?caseDetail(path.slice(7)):path==='/platforms'?platformsPage():path==='/about'?aboutPage():`<main id="main" class="wrap section">${empty('页面不存在','请从导航进入相关页面。')}<a class="button" href="/">返回首页</a></main>`;app.innerHTML=header()+main+footer();document.title=(path.startsWith('/cases/')?cases.find(x=>x.id===path.slice(7))?.title:nav.find(x=>x[0]===path)?.[1]||'业务与案例')+' · 银通联 MEDIA BANK';bindPage();setupMotion();}
function navigate(url,replace=false){if(replace)setRoute(url);else setRoute(url);render();if(!replace)window.scrollTo(0,0);}
function filter(values){const p=new URLSearchParams(previewLocation.search);for(const [key,value]of Object.entries(values))value?p.set(key,value):p.delete(key);p.set('view','all');navigate('/cases?'+p.toString(),true);}
function bindPage(){document.querySelectorAll('[data-filter-type]').forEach(el=>el.addEventListener('click',()=>filter({type:el.dataset.filterType})));document.querySelector('#category-filter')?.addEventListener('change',e=>filter({category:e.target.value}));document.querySelector('#client-filter')?.addEventListener('change',e=>filter({client:e.target.value}));document.querySelector('#search-form')?.addEventListener('submit',e=>{e.preventDefault();filter({q:new FormData(e.target).get('q')});});}
function setupMotion(){
 revealObserver?.disconnect();
 if(typeof IntersectionObserver==='undefined'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 revealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target);}});},{threshold:0.08});
 document.querySelectorAll('[data-reveal]').forEach(el=>{el.classList.add('reveal-ready');revealObserver.observe(el);});
}
function selectSpotlight(id){
 const c=cases.find(x=>x.id===id);const scene=document.querySelector('#hero-scene');
 if(!c||!scene)return;
 scene.innerHTML=heroScene(c);
 document.querySelectorAll('[data-hero]').forEach(el=>{const active=el.dataset.hero===id;el.classList.toggle('is-active',active);el.setAttribute('aria-pressed',String(active));});
}
function toast(message){const t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);}
async function copy(value){try{await navigator.clipboard.writeText(value);toast('链接已复制');}catch{toast('复制失败，请从浏览器地址栏复制');}}
function showGallery(items,index=0){galleryItems=items;galleryIndex=index;const d=document.querySelector('#gallery-dialog');updateGallery();d.showModal();}
function updateGallery(){const d=document.querySelector('#gallery-dialog');d.querySelector('img').src=galleryItems[galleryIndex];d.querySelector('img').alt='项目图片 '+(galleryIndex+1);d.querySelector('figcaption').textContent=`${galleryIndex+1} / ${galleryItems.length} · 可查看完整图片`;d.querySelector('.gallery-prev').hidden=galleryItems.length<2;d.querySelector('.gallery-next').hidden=galleryItems.length<2;}
document.querySelector('.gallery-prev').addEventListener('click',()=>{galleryIndex=(galleryIndex-1+galleryItems.length)%galleryItems.length;updateGallery();});document.querySelector('.gallery-next').addEventListener('click',()=>{galleryIndex=(galleryIndex+1)%galleryItems.length;updateGallery();});
document.querySelectorAll('dialog').forEach(d=>{d.querySelector('.dialog-close').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d)d.close();});});
document.addEventListener('keydown',e=>{if(document.querySelector('#gallery-dialog').open){if(e.key==='ArrowLeft')document.querySelector('.gallery-prev').click();if(e.key==='ArrowRight')document.querySelector('.gallery-next').click();}});
document.addEventListener('click',async e=>{
  const spotlight=e.target.closest('[data-hero]');if(spotlight){selectSpotlight(spotlight.dataset.hero);return;}
  const link=e.target.closest('a');if(link&&!link.hash&&link.origin===location.origin&&link.getAttribute('href')?.startsWith('/')&&!link.pathname.startsWith('/admin')&&!link.target&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&e.button===0){e.preventDefault();navigate(link.pathname+link.search);return;}
  if(e.target.closest('[data-contact]')){document.querySelector('#contact-content').innerHTML=`<span class="eyebrow">CONTACT MEDIA BANK</span><h2>沟通您的项目需求</h2>${contactItems()}<p class="muted" style="font-size:11px;margin-top:25px">${esc(config.company.contactNote)}</p>`;document.querySelector('#contact-dialog').showModal();}
  const gallery=e.target.closest('[data-gallery-case]');if(gallery){const c=cases.find(x=>x.id===gallery.dataset.galleryCase),i=Number(gallery.dataset.galleryIndex);showGallery(i===-1?[c.cover]:c.gallery,Math.max(0,i));}
  const qualification=e.target.closest('[data-qualification]');if(qualification)showGallery(config.company.qualificationImages,Number(qualification.dataset.qualification));
  if(e.target.closest('[data-share]')){try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await copy(location.href);}catch(err){if(err.name!=='AbortError')toast('请复制当前页面链接分享');}}
  const cp=e.target.closest('[data-copy-url]');if(cp)await copy(cp.dataset.copyUrl);
  const pButton=e.target.closest('[data-platform]');if(pButton){const p=config.platforms.find(x=>x.id===pButton.dataset.platform);if(!p)return;if(matchMedia('(max-width:700px)').matches&&!p.mobileUrl){await copy(p.url);toast('平台链接已复制，建议在电脑端登录使用');}else window.open(p.mobileUrl&&matchMedia('(max-width:700px)').matches?p.mobileUrl:p.url,'_blank','noopener,noreferrer');}
});
window.addEventListener('popstate',()=>render());
async function load(){try{const responses=await Promise.all([fetch('/api/public/config'),fetch('/api/public/cases')]);if(responses.some(x=>!x.ok))throw Error();config=await responses[0].json();cases=(await responses[1].json()).items;render();}catch{app.innerHTML='<main class="fatal"><h1 style="font-size:30px">展厅暂时未能打开</h1><p>请检查连接后重试。</p><button class="button" id="retry-load">重新加载</button></main>';document.querySelector('#retry-load').onclick=load;}}
load();
})()</script></body></html>
